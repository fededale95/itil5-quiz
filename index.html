<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITIL 5 Autoverifica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centred exam card (max 680px), progress rail on top, feedback panel below the options. */
:root {
  --bg: #F2F5F5;
  --surface: #FFFFFF;
  --fg: #1F2933;
  --muted: #5B6770;
  --line: #D3DCDE;
  --accent: #0B5D6B;
  --accent-soft: #E1EFF1;
  --ok: #2F7A3A;
  --ok-soft: #E6F3E8;
  --ko: #B3401F;
  --ko-soft: #FBEBE5;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181B; --surface: #182226; --fg: #E4ECEE; --muted: #93A3A9; --line: #2B3A3F;
    --accent: #5FB8C6; --accent-soft: #1B3339; --ok: #7CCB86; --ok-soft: #1C3222;
    --ko: #F0977A; --ko-soft: #3A2119; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181B; --surface: #182226; --fg: #E4ECEE; --muted: #93A3A9; --line: #2B3A3F;
  --accent: #5FB8C6; --accent-soft: #1B3339; --ok: #7CCB86; --ok-soft: #1C3222;
  --ko: #F0977A; --ko-soft: #3A2119; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }

.rail { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; }
.rail span { height: 6px; border-radius: 3px; background: var(--line); }
.rail span.cur { background: var(--accent); }
.rail span.ok { background: var(--ok); }
.rail span.ko { background: var(--ko); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.num { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 999px; }
.q { margin: 0; font-size: 18px; line-height: 1.45; font-weight: 600; text-wrap: pretty; }
.q-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--fg); }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
  font: inherit; font-size: 15px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt .k {
  flex: none; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 13px; font-weight: 600; border: 1px solid var(--line); color: var(--muted);
}
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--ko); background: var(--ko-soft); }
.opt.wrong .k { background: var(--ko); border-color: var(--ko); color: var(--surface); }
.opt.dim { opacity: .55; }

.fb { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.fb.ok { background: var(--ok-soft); }
.fb.ko { background: var(--ko-soft); }
.fb strong { font-size: 15px; }
.fb.ok strong { color: var(--ok); }
.fb.ko strong { color: var(--ko); }

.actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.btn {
  font: inherit; font-weight: 600; font-size: 15px; border-radius: 10px; padding: 10px 18px; cursor: pointer;
  background: var(--accent); color: var(--surface); border: 1px solid var(--accent);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--accent); }

.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-size: 48px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { font-size: 20px; color: var(--muted); }
.verdict { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.verdict.pass { color: var(--ok); background: var(--ok-soft); }
.verdict.fail { color: var(--ko); background: var(--ko-soft); }
.note { margin: 0; color: var(--muted); font-size: 14px; }
.review { display: flex; flex-direction: column; gap: 10px; }
.review h2 { margin: 0; font-size: 16px; }
.rv { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.rv .rq { font-weight: 600; }
.rv .ra { color: var(--muted); }
.rv .ra b { color: var(--ok); font-weight: 600; }
.rv .ry { color: var(--ko); }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.who { display: flex; flex-direction: column; gap: 8px; }
.who label { font-weight: 600; font-size: 15px; }
.who input {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%;
}
.who input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.err { color: var(--ko); font-size: 14px; margin: 0; }
.saved { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.saved.ko { color: var(--ko); }
.link { font: inherit; font-size: 14px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { .opt { transition: none; } }
@media (max-width: 480px) { .card { padding: 16px; } h1 { font-size: 22px; } .q { font-size: 17px; } }
</style>
<script src="config.js"></script>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">ITIL Foundation (Version 5) · Corso interno Nimbus</span>
    <h1>Autoverifica in 15 domande</h1>
    <p class="sub">Scegli una risposta, leggi la spiegazione e vai avanti. Domande sulla prima parte del corso. Obiettivo: almeno 10 su 15.</p>
  </header>
  <div class="rail" id="rail" aria-hidden="true"></div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
const QS = [
  { cat: "Valore", q: "Quale frase descrive meglio un outcome (risultato)?",
    o: ["Un report mensile prodotto dal fornitore", "Un esito per una parte interessata reso possibile da uno o più output", "Una funzionalità del servizio", "Una metrica di disponibilità"],
    a: 1, e: "L'outcome è l'esito per la parte interessata. Il report (A) è un output: un deliverable di un'attività, ciò che il fornitore produce." },
  { cat: "Prodotto e servizio", q: "Quale di queste è la definizione di «servizio»?",
    o: ["Una configurazione delle risorse di un'organizzazione progettata per offrire valore a un consumatore", "Un mezzo per abilitare la co-creazione del valore favorendo gli outcome desiderati, senza che il consumatore debba gestire costi e rischi specifici", "Una descrizione formale di uno o più servizi per un gruppo di consumatori", "Un insieme di metriche che definiscono la qualità prevista o raggiunta"],
    a: 1, e: "La firma della definizione è «senza dover gestire costi e rischi specifici». A è il prodotto, C l'offerta di servizio, D il livello di servizio." },
  { cat: "Relazioni", q: "Chi, in una relazione di servizio, autorizza il budget per il consumo del servizio?",
    o: ["Cliente", "Utente", "Sponsor", "Fornitore del servizio"],
    a: 2, e: "Lo sponsor autorizza il budget. Il cliente definisce i requisiti e si assume la responsabilità degli outcome; l'utente usa il servizio." },
  { cat: "Ciclo di vita", q: "Quale attività del ciclo di vita ha lo scopo di procurare o allocare le risorse necessarie per realizzare il prodotto?",
    o: ["Scoprire (Discover)", "Progettare (Design)", "Acquisire (Acquire)", "Costruire (Build)"],
    a: 2, e: "Acquisire procura o alloca le risorse. Costruire crea, configura e testa le soluzioni tecnologiche." },
  { cat: "Qualità", q: "Quale categoria di qualità descrive «quanto il servizio è disponibile e sicuro»?",
    o: ["Utilità (utility)", "Garanzia (warranty)", "User Experience", "Sostenibilità"],
    a: 1, e: "La garanzia è «come funziona il servizio», idoneo all'uso: disponibilità, capacità, sicurezza, continuità. L'utilità è «cosa fa», idoneo allo scopo." },
  { cat: "Valore", q: "Un'azienda sposta i server nel cloud: non deve più comprare hardware, ma paga un canone mensile. Il canone è un esempio di:",
    o: ["Costo rimosso", "Costo introdotto", "Rischio introdotto", "Outcome negativo"],
    a: 1, e: "Il canone è un costo introdotto dal servizio. L'hardware che non si compra più è un costo rimosso. C'è valore se i lati positivi superano quelli negativi." },
  { cat: "Ciclo di vita", q: "Il team monitora server e reti, pianifica i lavori e verifica che il rinnovo dei certificati sia in atto. Quale attività del ciclo di vita sta svolgendo?",
    o: ["Mettere in esercizio (Transition)", "Far funzionare (Operate)", "Erogare (Deliver)", "Supportare (Support)"],
    a: 1, e: "Far funzionare mantiene e monitora prodotti e sistemi di supporto, dietro le quinte. Erogare è il contatto diretto con gli utenti, Supportare ripristina quando qualcosa si rompe." },
  { cat: "Prodotto e servizio", q: "Un'offerta di servizio può includere:",
    o: ["Beni, accesso alle risorse e azioni del servizio", "Solo prodotti digitali", "SLA e metriche di qualità", "Principi guida e governance"],
    a: 0, e: "Un'offerta combina tre forme di interazione: trasferimento di beni (con la proprietà), accesso alle risorse (senza proprietà) e azioni del servizio svolte dal fornitore." },
  { cat: "Relazioni", q: "Quale tipo di relazione di servizio si concentra su innovazione e crescita, con obiettivi condivisi e spesso senza un accordo formale?",
    o: ["Base", "Cooperativa", "Collaborativa", "Transazionale"],
    a: 2, e: "Collaborativa: allineamento strategico e alta fiducia. La base punta a supporto ed efficienza, la cooperativa a miglioramento ed efficacia." },
  { cat: "Quattro dimensioni", q: "Quale di queste NON è una delle quattro dimensioni della gestione di prodotti e servizi?",
    o: ["Organizzazioni e persone", "Partner e fornitori", "Governance e conformità", "Flussi del valore e processi"],
    a: 2, e: "Le quattro dimensioni sono Organizzazioni e persone, Informazioni e tecnologia, Partner e fornitori, Flussi del valore e processi. La governance è un componente del Value System, che vediamo nel prossimo blocco." },
  { cat: "Qualità", q: "Come si chiama un accordo documentato tra un fornitore e un cliente che identifica i servizi e il livello concordato di ciascuno?",
    o: ["Livello di servizio", "Accordo sul livello di servizio (SLA)", "Offerta di servizio", "Relazione di servizio"],
    a: 1, e: "È lo SLA. Il livello di servizio è l'insieme di metriche; lo SLA è il documento concordato che le contiene." },
  { cat: "Ciclo di vita", q: "Quale attività ripristina il normale funzionamento dei prodotti e l'erogazione dei servizi quando necessario?",
    o: ["Far funzionare (Operate)", "Erogare (Deliver)", "Mettere in esercizio (Transition)", "Supportare (Support)"],
    a: 3, e: "Supportare ripristina: incidenti, disastri, problemi. Far funzionare garantisce le prestazioni concordate del prodotto; Erogare eroga i servizi basati sui prodotti live." },
  { cat: "Quattro dimensioni", q: "Una nuova normativa sulla protezione dei dati è un fattore esterno di tipo:",
    o: ["Politico", "Legale", "Sociale", "Tecnologico"],
    a: 1, e: "Legale: i requisiti legali impongono obblighi su protezione dei dati, sicurezza e contratti. Rientra nei fattori PESTLE che influenzano tutte e quattro le dimensioni." },
  { cat: "ITIL 5", q: "In ITIL 5, a cosa corrisponde la catena del valore?",
    o: ["Alle 34 pratiche di gestione", "Alle 8 attività del ciclo di vita dei prodotti e dei servizi", "Ai 7 principi guida", "Alle 4 dimensioni"],
    a: 1, e: "Le otto attività del ciclo di vita, da Scoprire a Supportare, formano insieme la catena del valore. In ITIL 4 le attività erano sei." },
  { cat: "Ciclo di vita", q: "Quali due affermazioni sul ciclo di vita dei prodotti e dei servizi sono corrette?",
    list: ["Le attività vanno eseguite sempre in sequenza.", "Le attività possono essere svolte in parallelo, ripetute o rivisitate.", "Le otto attività formano la catena del valore.", "Il ciclo di vita riguarda solo lo sviluppo del prodotto, non l'erogazione del servizio."],
    o: ["1 e 3", "2 e 3", "2 e 4", "1 e 4"],
    a: 1, e: "Le attività non sono sequenziali né lineari e insieme formano la catena del valore. Il ciclo copre sia il prodotto (Scoprire–Costruire) sia il servizio (Erogare–Supportare)." }
];
const LETTERS = ["A", "B", "C", "D"];
let order, idx, answers, shuffle = false, saved = false;
let player = "";
try { player = localStorage.getItem("itil5-quiz-name") || ""; } catch (_) {}
const card = document.getElementById("card");
const rail = document.getElementById("rail");
const CFG = window.QUIZ_CONFIG || {};
const DB_ON = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);

function askName(msg) {
  order = null;
  rail.innerHTML = QS.map(() => "<span></span>").join("");
  let h = `<form class="who" id="who" novalidate>`;
  h += `<label for="name">Come ti chiami?</label>`;
  h += `<input id="name" name="name" type="text" autocomplete="name" maxlength="80" placeholder="Nome e cognome" value="${esc(player).replace(/"/g, "&quot;")}">`;
  if (msg) h += `<p class="err" role="alert">${esc(msg)}</p>`;
  h += `<div class="actions"><span class="hint">${QS.length} domande · circa 10 minuti</span><button class="btn" type="submit">Inizia il quiz</button></div>`;
  h += `</form>`;
  card.innerHTML = h;
  const input = document.getElementById("name");
  input.focus({ preventScroll: true });
  document.getElementById("who").addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value.replace(/\s+/g, " ").trim();
    if (v.length < 2) return askName("Scrivi il tuo nome per iniziare.");
    player = v;
    try { localStorage.setItem("itil5-quiz-name", v); } catch (_) {}
    start(false);
  });
}

async function saveResult(right, pct) {
  if (!DB_ON) return null;
  const detail = order.map((qi, i) => ({ n: qi + 1, q: QS[qi].q, cat: QS[qi].cat, scelta: answers[i], corretta: QS[qi].a }));
  try {
    const r = await fetch(`${CFG.supabaseUrl}/rest/v1/quiz_results`, {
      method: "POST",
      headers: { apikey: CFG.supabaseAnonKey, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ quiz_id: CFG.quizId || "itil5", name: player, score: right, total: order.length, pct, shuffled: shuffle, answers: detail })
    });
    return r.ok;
  } catch (_) { return false; }
}

function start(randomize) {
  shuffle = !!randomize; saved = false;
  order = QS.map((_, i) => i);
  if (shuffle) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  idx = 0; answers = new Array(QS.length).fill(null);
  render();
}

function drawRail() {
  rail.innerHTML = "";
  order.forEach((qi, i) => {
    const s = document.createElement("span");
    const a = answers[i];
    if (a !== null) s.className = a === QS[qi].a ? "ok" : "ko";
    else if (i === idx) s.className = "cur";
    rail.appendChild(s);
  });
}

function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function render() {
  drawRail();
  if (idx >= order.length) return renderEnd();
  const q = QS[order[idx]];
  const chosen = answers[idx];
  const done = chosen !== null;
  const correctSoFar = answers.filter((a, i) => a !== null && a === QS[order[i]].a).length;
  let h = `<div class="meta"><span class="num">Domanda ${idx + 1} / ${order.length} · ${correctSoFar} corrette</span><span class="chip">${q.cat}</span></div>`;
  h += `<p class="q">${esc(q.q)}</p>`;
  if (q.list) h += `<ol class="q-list">${q.list.map(l => `<li>${esc(l)}</li>`).join("")}</ol>`;
  h += `<div class="opts">`;
  q.o.forEach((o, i) => {
    let cls = "opt";
    if (done) { if (i === q.a) cls += " right"; else if (i === chosen) cls += " wrong"; else cls += " dim"; }
    h += `<button class="${cls}" id="opt-${i}" data-i="${i}" ${done ? "disabled" : ""}><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`;
  });
  h += `</div>`;
  if (done) {
    const ok = chosen === q.a;
    h += `<div class="fb ${ok ? "ok" : "ko"}"><strong>${ok ? "Giusto." : `Sbagliato. La risposta corretta è ${LETTERS[q.a]}.`}</strong><span>${esc(q.e)}</span></div>`;
    h += `<div class="actions"><span class="hint">Invio per continuare</span><button class="btn" id="next">${idx === order.length - 1 ? "Vedi il risultato" : "Domanda successiva"}</button></div>`;
  } else {
    h += `<div class="actions"><span class="hint">Tastiera: A–D oppure 1–4</span></div>`;
  }
  card.innerHTML = h;
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(+b.dataset.i)));
  const n = document.getElementById("next");
  if (n) { n.addEventListener("click", next); n.focus({ preventScroll: true }); }
}

function pick(i) { if (answers[idx] !== null) return; answers[idx] = i; render(); }
function next() { idx++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

function renderEnd() {
  const right = answers.filter((a, i) => a === QS[order[i]].a).length;
  const pct = Math.round(right / order.length * 100);
  const pass = pct >= 65;
  const wrong = order.map((qi, i) => ({ q: QS[qi], a: answers[i] })).filter(x => x.a !== x.q.a);
  let h = `<div class="meta"><span class="num">Risultato</span><span class="verdict ${pass ? "pass" : "fail"}">${pass ? "Sopra la soglia" : "Sotto la soglia"}</span></div>`;
  h += `<div class="score"><span class="big">${right}</span><span class="of">/ ${order.length} · ${pct}%</span></div>`;
  h += `<p class="note">All'esame servono 26 risposte giuste su 40 (65%). Per stare tranquillo punta all'80% nelle simulazioni.</p>`;
  if (wrong.length) {
    h += `<div class="review"><h2>Da ripassare (${wrong.length})</h2>`;
    wrong.forEach(x => {
      h += `<div class="rv"><span class="rq">${esc(x.q.q)}</span><span class="ry">Hai risposto: ${LETTERS[x.a]}) ${esc(x.q.o[x.a])}</span><span class="ra">Corretta: <b>${LETTERS[x.q.a]}) ${esc(x.q.o[x.q.a])}</b> · ${esc(x.q.e)}</span></div>`;
    });
    h += `</div>`;
  } else {
    h += `<p class="note">Nessun errore. Prova di nuovo in ordine casuale per verificare che non stai ricordando la sequenza.</p>`;
  }
  h += `<div class="actions"><button class="btn ghost" id="again">Ricomincia</button><button class="btn" id="shuffle">Ricomincia in ordine casuale</button></div>`;
  h += `<div class="actions"><span class="saved" id="saved">${DB_ON ? "Salvataggio del risultato…" : ""}</span><button class="link" id="who-change">Non sei ${esc(player)}? Cambia nome</button></div>`;
  card.innerHTML = h;
  document.getElementById("again").addEventListener("click", () => start(false));
  document.getElementById("shuffle").addEventListener("click", () => start(true));
  document.getElementById("who-change").addEventListener("click", () => askName());
  if (!saved && DB_ON) {
    saved = true;
    saveResult(right, pct).then(ok => {
      const s = document.getElementById("saved");
      if (!s) return;
      s.textContent = ok ? `Risultato salvato a nome di ${player}.` : "Non è stato possibile salvare il risultato.";
      if (!ok) s.classList.add("ko");
    });
  } else if (saved) {
    document.getElementById("saved").textContent = "";
  }
}

document.addEventListener("keydown", e => {
  if (!order || idx >= order.length || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target instanceof HTMLInputElement) return;
  const k = e.key.toUpperCase();
  let i = LETTERS.indexOf(k);
  if (i < 0 && "1234".includes(k) && k.length === 1) i = +k - 1;
  if (i >= 0 && answers[idx] === null && i < QS[order[idx]].o.length) { e.preventDefault(); pick(i); }
